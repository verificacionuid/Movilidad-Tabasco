<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gafete</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f4f4f4; /* Color de fondo claro */
      min-height: 100vh;
      display: flex;
      justify-content: center; /* Centra horizontalmente */
      align-items: center;     /* Centra verticalmente */
      padding: 15px;
    }

    .imagen-centrada {
      max-width: 100%;
      max-height: 95vh;
      width: auto;
      height: auto;
      display: block;
      border-radius: 8px; /* Bordes suavemente redondeados */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); /* Sombra ligera */
    }
  </style>
</head>
<body>

  <!-- Aquí pones el nombre de la imagen que subiste a GitHub -->
  <img src="mi_gafete.png" alt="Gafete" class="imagen-centrada">

</body>
</html>
