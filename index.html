<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gafete Valido Registrado</title>
  <style>
    /* Estilos globales y contenedor principal */
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    .gafete-container {
      position: relative;
      width: 100%;
      max-width: 400px; /* Ajusta según el ancho de la plantilla en pantalla */
    }

    /* Imagen de la plantilla completa */
    .plantilla-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Posicionamiento exacto sobre el cuadro rojo */
    .foto-overlay {
      position: absolute;
      top: 27.2%;     /* Posición vertical relativa */
      left: 50.2%;    /* Posición horizontal relativa */
      width: 37.8%;   /* Ancho del recuadro rojo */
      height: 34.5%;  /* Alto del recuadro rojo */
      object-fit: cover; /* Ajusta la foto sin deformarla */
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="gafete-container">
    <!-- Imagen del gafete base sin foto -->
    <img src="plantilla_gafete.png" alt="Gafete" class="plantilla-img">
    
    <!-- Tu foto pegada exactamente sobre el cuadro blanco -->
    <img src="mi_foto.jpg" alt="Foto de perfil" class="foto-overlay">
  </div>

</body>
</html>
